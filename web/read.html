<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jmlib · 阅读器</title>
<style>
  :root { color-scheme: dark; --bg:#12151b; --panel:#1b202a; --line:#2c3442;
          --text:#e8ecf3; --muted:#98a4b6; --accent:#6ea8fe; --danger:#ff8585; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:3; display:flex; flex-wrap:wrap; gap:6px 8px;
           align-items:center; padding:9px 16px; background:rgba(18,21,27,.96);
           border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0 8px 0 0; font-weight:600; max-width:26vw;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  a { color:var(--accent); }
  button, select, input { padding:6px 9px; border-radius:8px; border:1px solid var(--line);
                          background:var(--panel); color:var(--text); font-size:13px; }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
      outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled, select:disabled, input:disabled { opacity:.45; cursor:not-allowed; }
  button:not(:disabled):hover, select:not(:disabled):hover { border-color:var(--accent); }
  button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .group { display:flex; gap:4px; align-items:center; font-size:12px; color:var(--muted); }
  .spacer { flex:1 1 auto; }
  #status { padding:7px 16px; color:var(--muted); font-size:13px; min-height:32px; }
  #status.error { color:var(--danger); }
  #mem { padding:0 16px 6px; color:var(--muted); font-size:12px; min-height:20px; }
  #mem.error { color:var(--danger); }
  main { padding:0 16px 24px; }
  #viewer { position:relative; display:block; min-height:55vh; background:#0d1016;
            border:1px solid var(--line); border-radius:12px; overflow:hidden;
            touch-action:pan-y; }
  #viewer.fit-original { overflow:auto; }
  .pages { display:flex; gap:6px; align-items:center; justify-content:center;
           min-height:55vh; padding:6px; }
  /* RTL shows the earlier page on the right, which is exactly row-reverse when
     the slots are already in reading order. */
  #viewer[data-dir="rtl"] .pages { flex-direction:row-reverse; }
  .page { display:block; object-fit:contain; border-radius:4px; }
  .page[hidden] { display:none; }
  #viewer.fit-height .page { max-height:calc(100vh - 268px); max-width:100%; width:auto; }
  #viewer.fit-width .page { width:100%; height:auto; max-height:none; }
  #viewer.fit-width[data-layout="double"] .page { width:calc(50% - 3px); }
  #viewer.fit-original .page { max-width:none; max-height:none; }
  #viewer[aria-busy="true"] .page { opacity:.35; }
  /* Continuous reading: one column, its own scrollbar.  The paged slots stay in
     the DOM but are hidden, so switching modes never rebuilds the page. */
  #viewer[data-layout="scroll"] .pages { display:none; }
  #scroll { display:flex; flex-direction:column; gap:2px; align-items:center;
            max-height:calc(100vh - 268px); overflow-y:auto; padding:6px; }
  #scroll[hidden] { display:none; }
  #scroll img { display:block; width:100%; max-width:920px; height:auto; background:#0d1016;
                border-radius:4px; }
  #scroll img:not([src]) { min-height:60vh; }
  .placeholder { position:absolute; inset:0; display:flex; flex-direction:column; gap:10px;
                 align-items:center; justify-content:center; text-align:center; padding:20px;
                 color:var(--muted); background:#0d1016; }
  .placeholder[hidden] { display:none; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  #progress { flex:1 1 180px; min-width:120px; padding:0; border:none; background:transparent;
              accent-color:var(--accent); }
  #jump { width:74px; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  @media (max-width:600px) { header { padding:7px 10px; } h1 { max-width:44vw; }
    #status, #mem, main { padding-left:10px; padding-right:10px; }
    #viewer.fit-height .page { max-height:calc(100vh - 300px); } }
  @media (prefers-reduced-motion:no-preference) { .page { transition:opacity .15s ease; } }
</style>
</head>
<body>
<header>
  <a href="/" aria-label="返回书库">← 书库</a>
  <h1 id="book-title">载入中…</h1>
  <select id="chapter" aria-label="选择章节" disabled><option value="">载入章节…</option></select>
  <div class="group">
    <button id="prev-ch" type="button" disabled aria-label="上一章">‹ 上章</button>
    <button id="next-ch" type="button" disabled aria-label="下一章">下章 ›</button>
  </div>
  <span class="spacer"></span>
  <div class="group">
    <label for="dir">方向</label>
    <select id="dir" aria-label="阅读方向">
      <option value="ltr">左 → 右</option>
      <option value="rtl">右 → 左</option>
    </select>
  </div>
  <div class="group">
    <label for="layout">版式</label>
    <select id="layout" aria-label="每屏页数">
      <option value="single">单页</option>
      <option value="double">双页</option>
      <option value="scroll">连续</option>
    </select>
  </div>
  <div class="group">
    <label for="fit">适配</label>
    <select id="fit" aria-label="图片适配方式">
      <option value="height">适合高度</option>
      <option value="width">适合宽度</option>
      <option value="original">原始尺寸</option>
    </select>
  </div>
  <button id="fs" type="button" aria-pressed="false">全屏</button>
  <button id="bm-add" type="button" disabled>★ 加书签</button>
  <select id="bm-list" aria-label="跳到书签" disabled><option value="">书签（0）</option></select>
</header>
<div id="status" role="status" aria-live="polite">正在载入书本信息…</div>
<div id="mem" role="status" aria-live="polite"></div>
<main>
  <div id="viewer" class="fit-height" data-layout="single" data-dir="ltr" aria-busy="true">
    <div id="pages" class="pages">
      <img class="page" alt="" hidden>
      <img class="page" alt="" hidden>
    </div>
    <div id="scroll" hidden></div>
    <div id="placeholder" class="placeholder"><span>正在载入页面…</span></div>
  </div>
  <div id="action" class="controls">
    <button id="prev" type="button" disabled aria-label="上一页">上一页</button>
    <input id="progress" type="range" min="1" max="1" value="1" step="1"
           aria-label="阅读进度，拖动或点击跳页" disabled>
    <button id="next" type="button" disabled aria-label="下一页">下一页</button>
    <span class="spacer"></span>
    <label for="jump" style="font-size:12px;color:var(--muted)">跳页</label>
    <input id="jump" type="number" min="1" step="1" inputmode="numeric" aria-label="跳转到页码" disabled>
    <button id="go" type="button" disabled>跳转</button>
  </div>
  <div class="hint">
    键盘：← / → 翻页（右→左时方向相反），空格下一页，Home / End 本章首尾，Esc 退出全屏或回书库；
    手机可左右滑动，滚到章末会自动进入下一章。翻页自动记录记忆点，重开本书回到同一位置。
  </div>
</main>
<script src="/assets/read.js" defer></script>
</body>
</html>
