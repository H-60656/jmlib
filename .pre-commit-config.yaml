# 提交前自动检查。安装：pre-commit install
# 全部 hook 与 CI（.github/workflows/lint.yml）保持一致。
#
# 这里不挂 mypy：pre-commit 会给每个 hook 建隔离环境，mypy 在那个环境里看不到
# 项目的真实依赖（fastapi / uvicorn / jmcomic / pyyaml），只能靠 ignore_missing_imports
# 掩盖，反而查不出真问题。mypy 由 lint.yml 的独立 job 在装好依赖的环境里跑，
# 本地提交前手动跑一次：python -m mypy src/
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/aegis/
      - id: end-of-file-fixer
        exclude: ^docs/aegis/
      - id: check-yaml
      - id: check-json
        exclude: ^docs/aegis/
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: \.(bat|cmd|ps1)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # 先跑 linter 的自动修复，再跑格式化，顺序不能反
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
