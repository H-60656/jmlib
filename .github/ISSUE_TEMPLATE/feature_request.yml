name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先看一眼 [README](../README.md) 与 [CONTRIBUTING](../CONTRIBUTING.md)：
        jmlib 有几条刻意不做的设计（比如**永不自动执行破坏性动作**），建议在这些边界内提。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的是什么问题
      description: 描述场景，而不是先给方案。"我在做 X 的时候卡在 Y" 比 "加一个 Z 按钮" 有用得多
      placeholder: 我有 3000 多个未识别包，逐条点复核要很久……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的解法
      description: 如果有多种方案，都写出来，并说明你倾向哪个、为什么
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 包括"我现在是怎么绕过去的"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - migrate（归档迁移）
        - index（重建索引）
        - ingest（散装入库）
        - resolve（未识别回查）
        - promote（转正）
        - serve / 网页界面
        - check / health（存储体检）
        - 治理与安全
        - 其他 / 跨模块
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: 这个改动会不会动到已有数据
      description: |
        如果会，请说明风险与回滚方式。触及下面任一条的，请特别说明如何不破坏它：

        - `store.py` 是唯一数据库写入入口
        - `library/` 的字节是真相，索引可重建
        - 破坏性动作永不自动执行
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已在 issue 列表中搜索过类似建议
          required: true
        - label: 本 issue 不包含具体的受版权保护内容或资源链接
          required: true
