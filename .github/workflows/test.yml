name: test

on:
  push:
    branches: [master, dev, "feat/**", "feature/**", "fix/**"]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8.0"

      - name: Import smoke test
        env:
          PYTHONPATH: src
        run: python -c "import jmlib, jmlib.cli, jmlib.store, jmlib.governance; print('jmlib', jmlib.__version__)"

      - name: Contract tests (unittest)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v

      - name: Contract tests (pytest)
        env:
          PYTHONPATH: src
        run: python -m pytest -q
